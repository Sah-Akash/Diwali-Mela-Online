      <stop offset="0%" stop-color="#090f1d" />
      <stop offset="55%" stop-color="#131f38" />
      <stop offset="100%" stop-color="#24192c" />
    </linearGradient>
    <radialGradient id="moonGlow" cx="78%" cy="38%" r="36%">
      <stop offset="0%" stop-color="#ffcf70" stop-opacity="0.45" />
      <stop offset="60%" stop-color="#f1aa49" stop-opacity="0.12" />
