      <stop offset="45%" stop-color="#0f1b33" />
      <stop offset="80%" stop-color="#22172b" />
      <stop offset="100%" stop-color="#17101f" />
    </linearGradient>
    <radialGradient id="melaGlow" cx="74%" cy="46%" r="48%">
      <stop offset="0%" stop-color="#ffbe55" stop-opacity="0.48" />
      <stop offset="45%" stop-color="#f1aa49" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#050914" stop-opacity="0" />
